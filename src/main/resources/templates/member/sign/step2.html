<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="inc/user/layout" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>기농이네 - 순수한 땅, 순수한 먹거리</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="/js/user/signup/step2.js" defer></script>
</head>
<body>
<main layout:fragment="main" class="d:flex fl-dir:column gap:8 md:gap:13 max-w:9 w:10p pl:4 pr:4 md:pl:0 md:pr:0">
    <section>
        <h1 class="d:none">navi 영역</h1>
        <div class="n-item n-item-type:underline bd-color:main-6 fs:4 txt-al:center fw:bold">회원가입</div>
    </section>

    <section>
        <h1 class="d:none">step 영역</h1>
        <div class="d:flex jc:center gap:4">
            <div class="n-item n-item-type:outline-box fs:4 txt-al:center bd-radius:full n-list-item-padding:1 ai:center d:flex jc:center" style="width: 21px; height: 21px;"><span>1</span></div>
            <div class="n-item n-item-type:outline-box fs:4 txt-al:center bd-radius:full n-list-item-padding:1 ai:center d:flex jc:center bg-color:main-6" style="width: 21px; height: 21px;"><span class="color:base-1">2</span></div>
            <div class="n-item n-item-type:outline-box fs:4 txt-al:center bd-radius:full n-list-item-padding:1 ai:center d:flex jc:center" style="width: 21px; height: 21px;"><span>3</span></div>
        </div>
    </section>

    <section class="d:flex fl-grow:1 fl-dir:column">
        <h1 class="d:none">회원정보 입력 영역</h1>
        <form method="post"  class="d:flex fl-dir:column gap:10 md:gap:15 mb:4 md:mb:8">
            <section>
                <h1>이름<span class="color:accent-3">*</span></h1>
                <div><input type="text" v-model="mbr.nm" class="n-textbox n-textbox-type:underline" autofocus autocomplete="false" @input="checkFormat('nm')"/></div>
                <div class="color:accent-3" :class="{'d:none': valid.nm}" >이름을 입력해주세요</div>
            </section>
            <section>
                <h1>전화번호<span class="color:accent-3">*</span></h1>
                <div >
                    <input type="text" inputmode="number" v-model="mbr.phone" class="n-textbox n-textbox-type:underline" autocomplete="false" @input="checkFormat('phone')"/>
                </div>
                <div class="color:accent-3" :class="{'d:none': valid.phone}" >전화번호를 입력해주세요</div>
            </section>
            <section>
                <h1>생년월일<span class="color:accent-3">*</span></h1>
                <div class="w:10p deco icon:calendar_blank icon-size:2 icon-color:base-9 deco-pos:right" @click="openDatePicker">
                    <input type="text" v-model="mbr.birthDd" class="datepicker n-textbox n-textbox-type:underline" ref="date"/>
                </div>
                <div class="color:accent-3" :class="{'d:none': valid.birthDd}">생년월일을 입력해주세요</div>
                <div class="color:accent-3" :class="{'d:none': valid.age}">14세 미만의 회원은 가입할 수 없습니다.</div>
            </section>
            <section class="d:flex fl-dir:column gap:10 md:gap:15" ref="confirm">
                <h1 class="d:none">이메일 영역</h1>
                <div th:if="${social!=null}">
                    <div>이메일<span class="color:accent-3">*</span></div>
                    <div class="n-textbox n-textbox-type:underline">
                        user@ginong.co.kr
                    </div>
                </div>
                <div th:else class="d:flex fl-dir:column gap:10 md:gap:15">
                    <div>
                        <div>이메일<span class="color:accent-3">*</span></div>
                        <div class="d:flex col-gap:2">
                            <input type="text" v-model="mbr.email" class="n-textbox n-textbox-type:underline"
                                   autocomplete="false" :readonly="isSend" @input="checkEmail"/>
                            <div id="send" class="n-btn n-btn:outline color:base-9"
                                    style="top:-3px;" @click="send">인증번호 발송
                            </div>
                        </div>
                        <div class="color:accent-3" :class="{'d:none': valid.email}">이메일을 입력해주세요</div>
                        <div class="color:accent-3" :class="{'d:none': valid.format}">유효한 형식이 아니에요</div>
                    </div>
                    <div >
                        <div>인증번호</div>
                        <div class="d:flex col-gap:2">
                            <input type="text" inputmode="number" v-model="code" class="n-textbox n-textbox-type:underline"
                                   autocomplete="false" @input="checkFormat('code')" :readonly="!isSend"/>
                            <button id="confirm" class="n-btn n-btn:outline color:base-9" :disabled="!isSend" style="top:-3px;" @click="confirm">
                                인증번호 확인
                            </button>
                        </div>
                       <div class="d:flex col-gap:2 h:2">
                           <div class="fl-grow:1">
                               <div id="result" ref="result" v-text="result"></div>
                               <div class="color:accent-3" :class="{'d:none': valid.code}">인증번호를 입력해주세요</div>
                           </div>
                           <div id="timer" class="d:flex jc:end mr:6 d:none" style="width: 110px;">인증 유효 시간</div>
                       </div>
                    </div>
                </div>
            </section>
            <div class="d:flex gap:8">
                <div class="fl-grow:1"><a href="javascript:history.back()" class="n-btn n-btn:outline w:10p">이전</a></div>
                <div class="fl-grow:1 n-btn" @click="submit">다음</div>
            </div>
        </form>
    </section>
</main>
</body>
</html>
